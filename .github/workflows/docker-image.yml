name: Build and Push Docker Image

on:
    push:
        branches: [master]
    workflow_dispatch:

jobs:
    # Gate: typecheck + unit tests must pass before we build/push an image.
    # astro/esbuild does NOT type-check and nothing else ran the test suite in
    # CI, so type errors and broken contracts (e.g. the proxy regressions) used
    # to ship silently. `build` depends on this job, so a red check blocks the
    # image — and therefore the Railway deploy that watches this workflow.
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type-check
              run: pnpm run typecheck:ts6

            - name: Unit tests
              run: pnpm test run

    build:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/jetlag-hide-and-seek:latest
                      ${{ secrets.DOCKER_USERNAME }}/jetlag-hide-and-seek:${{ github.sha }}
