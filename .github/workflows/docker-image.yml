name: Build and Push Docker Image

on:
    push:
        branches: [master]
    workflow_dispatch:

jobs:
    # Gate: typecheck + unit tests must pass before we build/push an image.
    # astro/esbuild does NOT type-check and nothing else ran the test suite in
    # CI, so type errors and broken contracts (e.g. the proxy regressions) used
    # to ship silently. `build` depends on this job, so a red check blocks the
    # image — and therefore the Railway deploy that watches this workflow.
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # tsc relies on Astro's generated .astro/types.d.ts for
            # import.meta.env etc.; it doesn't exist in a fresh checkout, so
            # generate it before type-checking (otherwise tsc fails with
            # "Property 'env' does not exist on type 'ImportMeta'").
            - name: Generate Astro types
              run: pnpm exec astro sync

            - name: Type-check
              run: pnpm run typecheck:ts6

            - name: Unit tests
              run: pnpm test run

    # Docker image build (+ optional Hub publish). Railway deploys from the
    # repo via its own GitHub integration, so the push is NOT the deploy path.
    # The image is ALWAYS built — that validates the production Dockerfile in
    # CI. The push only happens when DOCKER_USERNAME/DOCKER_PASSWORD secrets are
    # set; without them we build (push: false) instead of failing on "Username
    # and password required".
    build:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
            DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        steps:
            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false

            - name: Check Docker Hub credentials
              id: creds
              run: |
                  if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
                      echo "present=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "present=false" >> "$GITHUB_OUTPUT"
                      echo "Docker Hub secrets not set — skipping image publish (Railway deploys separately)."
                  fi

            # Buildx is needed for the build regardless of whether we push,
            # so it always runs — the build itself validates the production
            # Dockerfile in CI even when Docker Hub secrets are absent.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

            - name: Log in to Docker Hub
              if: steps.creds.outputs.present == 'true'
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            # No credentials: still build the image (validates the Dockerfile)
            # but don't push.
            - name: Build Docker image
              if: steps.creds.outputs.present != 'true'
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  context: .
                  push: false
                  tags: jetlag-hide-and-seek:ci-${{ github.sha }}

            - name: Build and push Docker image
              if: steps.creds.outputs.present == 'true'
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/jetlag-hide-and-seek:latest
                      ${{ secrets.DOCKER_USERNAME }}/jetlag-hide-and-seek:${{ github.sha }}
