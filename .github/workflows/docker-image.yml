name: Build and Push Docker Image

on:
    push:
        branches: [master]
    workflow_dispatch:

jobs:
    # Gate: typecheck + unit tests must pass before we build/push an image.
    # astro/esbuild does NOT type-check and nothing else ran the test suite in
    # CI, so type errors and broken contracts (e.g. the proxy regressions) used
    # to ship silently. `build` depends on this job, so a red check blocks the
    # image — and therefore the Railway deploy that watches this workflow.
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Set up pnpm
              uses: pnpm/action-setup@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # tsc relies on Astro's generated .astro/types.d.ts for
            # import.meta.env etc.; it doesn't exist in a fresh checkout, so
            # generate it before type-checking (otherwise tsc fails with
            # "Property 'env' does not exist on type 'ImportMeta'").
            - name: Generate Astro types
              run: pnpm exec astro sync

            - name: Type-check
              run: pnpm run typecheck:ts6

            - name: Unit tests
              run: pnpm test run

    # Optional Docker Hub publish. Railway deploys from the repo via its own
    # GitHub integration, so this image push is NOT the deploy path — it only
    # runs when DOCKER_USERNAME/DOCKER_PASSWORD secrets are set. Without them
    # the docker steps are skipped (job stays green) instead of failing on
    # "Username and password required".
    build:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
            DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Check Docker Hub credentials
              id: creds
              run: |
                  if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
                      echo "present=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "present=false" >> "$GITHUB_OUTPUT"
                      echo "Docker Hub secrets not set — skipping image publish (Railway deploys separately)."
                  fi

            - name: Set up Docker Buildx
              if: steps.creds.outputs.present == 'true'
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              if: steps.creds.outputs.present == 'true'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              if: steps.creds.outputs.present == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/jetlag-hide-and-seek:latest
                      ${{ secrets.DOCKER_USERNAME }}/jetlag-hide-and-seek:${{ github.sha }}
