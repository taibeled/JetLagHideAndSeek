name: Deploy to Railway

# Manual-only. Production deploys happen through Railway's NATIVE GitHub
# integration (the railway-app bot deploys every push to master directly);
# this CLI-based workflow is an unused alternative that requires
# RAILWAY_API_TOKEN / *_ID secrets which were never configured. With the
# workflow_run trigger it fired (and failed "Unauthorized") on every push,
# making it look like deploys were broken when the real path was fine.
on:
    # workflow_dispatch has no branches: filter in GitHub workflow syntax; master-only manual runs are enforced in deploy.if below (github.ref).
    workflow_dispatch:

jobs:
    deploy:
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install Railway CLI
              run: npm install -g @railway/cli

            - name: Link Railway project and redeploy
              env:
                  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
                  RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
                  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
                  RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
              run: |
                  railway link --service=$RAILWAY_SERVICE_ID --project=$RAILWAY_PROJECT_ID --environment=$RAILWAY_ENVIRONMENT_ID
                  railway redeploy --yes
