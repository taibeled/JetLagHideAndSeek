name: Deploy to GitHub Pages

# Manual-only. This fork deploys via Railway's native GitHub integration
# (the SSR app at jetlaghideandseek-production.up.railway.app); the GH Pages
# static mirror is upstream's deploy target, not ours. Running it on every
# push just painted a red X on every commit — it had been failing on a pnpm
# version conflict — and made real deploys look broken.
on:
    workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout your repository using git
              uses: actions/checkout@v4
            - name: Install, build, and upload your site
              uses: withastro/action@v3
              with:
                  path: . # The root location of your Astro project inside the repository. (optional)
                  node-version: 20 # The specific version of Node that should be used to build your site. Defaults to 20. (optional)
                  # No package-manager pin: package.json's `packageManager`
                  # field declares the exact pnpm version, and specifying one
                  # here too makes withastro/action fail with "Multiple
                  # versions of pnpm specified".

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
