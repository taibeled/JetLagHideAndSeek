# Pin Node for Railway/Nixpacks.
#
# Nixpacks' default nixpkgs snapshot predates Node 24, so we override
# `nixpkgsArchive` to a recent nixos-unstable commit that has nodejs_24.
# Equivalent to:
#   nix-shell -I nixpkgs=https://github.com/NixOS/nixpkgs/archive/<rev>.tar.gz \
#             -p nodejs_24 pnpm
#
# `providers = []` disables Nixpacks' auto-detection so nothing sneaks a
# second nodejs into the derivation. Install and build phases are owned
# here; deploy startCommand stays in railway.json.

providers = []

[phases.setup]
nixpkgsArchive = "4bd9165a9165d7b5e33ae57f3eecbcb28fb231c9"
nixPkgs = ["nodejs_24", "pnpm"]

# Install phase: cache the pnpm STORE (downloaded package tarballs), NOT
# node_modules. Caching node_modules as a Docker cache mount would make it
# invisible to the build phase (cache mounts don't persist across RUN steps).
# Caching the store means pnpm install reads packages from disk instead of
# the network; node_modules is written normally into the image layer.
[phases.install]
cmds = ["pnpm install --frozen-lockfile --prefer-offline --store-dir /pnpm-store"]
cacheDirectories = ["/pnpm-store"]

# Build phase: cache .astro so Vite reuses incremental compilation
# artifacts for unchanged source files across builds.
[phases.build]
cmds = ["NODE_OPTIONS='--max-old-space-size=4096' pnpm build"]
cacheDirectories = [".astro"]
